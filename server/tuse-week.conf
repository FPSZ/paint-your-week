# 涂色周历 — only answers requests addressed to the bare IP; the domain sites on this server are untouched.
# Per-IP limits: API 5 r/s (burst 20), page 10 r/s, fonts 30 r/s; 20 connections per IP, 400 in total.
limit_req_zone  $binary_remote_addr zone=tuse_api:10m    rate=5r/s;
limit_req_zone  $binary_remote_addr zone=tuse_page:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=tuse_static:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=tuse_conn:10m;
limit_conn_zone $server_name        zone=tuse_total:1m;

server {
    listen 80;
    server_name __HOST__;

    # Same as the catch-all default site, so the bare IP root looks exactly as before.
    root  /www/server/nginx/html;
    index index.html;

    client_max_body_size  256k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;
    limit_conn tuse_conn  20;
    limit_conn tuse_total 400;
    limit_req_status  429;
    limit_conn_status 429;

    location = /week { return 301 /week/; }

    location ^~ /week/api/ {
        limit_req zone=tuse_api burst=20 nodelay;
        limit_except GET PUT { deny all; }
        proxy_pass http://127.0.0.1:18731;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
        proxy_request_buffering on;
    }

    location ^~ /week/fonts/ {
        root /www/wwwroot/tuse-week-site;
        limit_req zone=tuse_static burst=60 nodelay;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Built files carry a content hash in their names, so browsers can keep them for a year.
    location ^~ /week/assets/ {
        root /www/wwwroot/tuse-week-site;
        limit_req zone=tuse_static burst=60 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /week/ {
        root /www/wwwroot/tuse-week-site;
        limit_req zone=tuse_page burst=20 nodelay;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        try_files $uri $uri/ =404;
    }
}
