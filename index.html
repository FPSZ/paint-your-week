<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>涂色周历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%272%27 y=%272%27 width=%2713%27 height=%2713%27 rx=%274%27 fill=%27%233C5CFF%27/%3E%3Crect x=%2717%27 y=%272%27 width=%2713%27 height=%2713%27 rx=%274%27 fill=%27%23FFB21A%27/%3E%3Crect x=%272%27 y=%2717%27 width=%2713%27 height=%2713%27 rx=%274%27 fill=%27%23FF3B6B%27/%3E%3Crect x=%2717%27 y=%2717%27 width=%2713%27 height=%2713%27 rx=%274%27 fill=%27%2322C993%27/%3E%3C/svg%3E">
<script>try{var r=document.documentElement;window.__tuseHostTheme=r.getAttribute("data-theme");var t=localStorage.getItem("tuse-week-theme");if(t==="light"||t==="dark")r.setAttribute("data-theme",t)}catch(e){}</script>
<!--fonts-->
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" id="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="13" height="13" rx="4" fill="var(--c-deep)"/>
        <rect x="17" y="2" width="13" height="13" rx="4" fill="var(--c-admin)"/>
        <rect x="2" y="17" width="13" height="13" rx="4" fill="var(--c-life)"/>
        <rect class="lg-4" x="17.75" y="17.75" width="11.5" height="11.5" rx="3.5"/>
      </svg>
      <div class="brand-t">
        <h1>涂色周历</h1>
        <button class="who" id="userBtn" type="button" hidden><span class="av" id="userAv">?</span><span id="userName"></span><svg class="ic" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></svg></button>
      </div>
    </div>
    <nav class="weeknav" aria-label="切换周">
      <div class="vsw" id="vsw" role="group" aria-label="视图"><button type="button" data-v="week" class="on" aria-pressed="true">周</button><button type="button" data-v="month" aria-pressed="false">月</button><i class="vsw-ind" aria-hidden="true"></i></div>
      <button class="nav-btn" id="prevW" aria-label="上一周"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="nav-btn" id="nextW" aria-label="下一周"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="wk" id="wkLabel" type="button"><span class="wk-no" id="wkNo">第 1 周</span><span class="wk-range" id="wkRange"></span><span class="wk-tag rel" id="wkTag" hidden></span><span class="wk-tag back" id="wkBack">回本周</span></button>
      <button class="chip-btn this-w" id="thisW" type="button" inert><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="thisWT">回到本周</span></button>
    </nav>
    <div class="actions">
      <span class="sync" id="sync" data-s="local" title="数据保存在这台设备的浏览器里"><i></i><span>仅本机</span></span>
      <button class="btn ghost" id="planBtn" title="周计划仪式"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4zM9 4v13M15 6.5v13"/></svg><span class="act-label">周计划</span></button>
      <button class="btn ghost" id="shutBtn" title="收工仪式"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><path d="M19 2.5v4M21 4.5h-4"/></svg><span class="act-label">收工</span></button>
      <button class="btn ghost" id="reviewBtn" title="周复盘"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V7M17 16v-8"/></svg><span class="act-label">复盘</span></button>
      <span class="act-gap" aria-hidden="true"></span><button class="icon-btn" id="themeBtn" type="button" aria-label="切换外观"></button>
      <button class="icon-btn" id="setBtn" aria-label="设置"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main class="main">
    <section class="cal" id="cal" aria-label="一周时间网格">
      <div class="scroller" id="scroller">
        <div class="dayheads" id="dayheads"><div class="corner" id="corner"></div></div>
        <div class="grid" id="grid">
          <div class="gutter" id="gutter"></div>
          <div class="cols" id="cols"><div class="bands" id="bands"></div></div>
        </div>
      </div>
      <div class="empty" id="empty" hidden></div>
    </section>

    <aside class="side" id="side">
      <section aria-label="现在"><div id="now"></div></section>

      <section class="prog" aria-label="本周进度">
        <div class="ring-wrap" id="ringWrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="trk" cx="60" cy="60" r="50"/>
            <g id="arcs" transform="rotate(-90 60 60)"></g>
          </svg>
          <div class="ring-c"><span class="pct" id="pct">0<sup>%</sup></span><small>本周涂色</small></div>
        </div>
        <div>
          <p class="prog-line" id="progLine"></p>
          <dl class="stats" id="stats"></dl>
        </div>
      </section>

      <section class="goals" aria-label="本周三件大事">
        <header class="sec-h"><h2>本周三件大事</h2><button class="why" data-why="goals" aria-label="为什么是三件大事">?</button></header>
        <ul id="goals"></ul>
      </section>

      <button class="sci-link" id="sciBtn">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM14 4v5h5M8 13h8M8 17h6"/></svg>
        <span>设计依据</span>
      </button>
    </aside>

    <div class="mview" id="mv" hidden>
      <aside class="mv-side" id="mvSide" aria-label="本月概览"></aside>
      <section class="mv-cal" id="mvCal" aria-label="月历">
        <div class="mv-head" aria-hidden="true"><span></span><span><em>周</em>一</span><span><em>周</em>二</span><span><em>周</em>三</span><span><em>周</em>四</span><span><em>周</em>五</span><span><em>周</em>六</span><span><em>周</em>日</span></div>
        <div class="mv-grid" id="mvGrid"></div>
      </section>
    </div>
  </main>
</div>

<div class="ibx" id="ibx">
  <button class="ibx-fab" id="ibxFab" type="button" aria-expanded="false" aria-controls="ibxPanel" title="待安排（N）"><svg class="ic" viewBox="0 0 24 24"><path d="M4.5 13.5h4l1.5 2.5h4l1.5-2.5h4"/><path d="M6.2 5h11.6l2.7 8.5V19H3.5v-5.5z"/></svg><span>待安排</span><b class="ibx-n" id="inCount" hidden>0</b></button>
  <section class="ibx-panel" id="ibxPanel" aria-label="待安排" hidden>
    <header class="ibx-h" id="ibxHandle"><svg class="grip" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg><h2>待安排</h2><span class="sp"></span><button class="icon-btn sm" id="ibxMin" type="button" aria-label="收起"><svg class="ic" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button></header>
    <div class="ibx-body">
      <form class="in-form" id="inForm" autocomplete="off">
        <label class="sr" for="inInput">新的待安排事项</label>
        <input class="in-input" id="inInput" placeholder="想到的事，先丢这里" maxlength="60">
        <div class="in-opts">
          <div class="in-cats" id="inCats"></div>
          <div class="in-ests" id="inEsts"></div>
        </div>
      </form>
      <ul class="in-list" id="inList"></ul>
      <p class="in-tip" id="inTip" hidden>拖进时间格，或点 <svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px;vertical-align:-2px"><path d="M4 7h10a5 5 0 0 1 0 10H8M11 13l-4 4 4 4"/></svg> 自动排</p>
    </div>
  </section>
</div>
<div class="drop-cancel" id="dropCancel" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="t1">拖到这里取消</span><span class="t2">松手取消</span></div>
<div id="layer"></div>
<div class="pop" id="pop" role="dialog" aria-label="编辑时间块" hidden>
  <div class="pop-hd">
    <i class="ed-sw" aria-hidden="true"></i>
    <label class="sr" for="edTitle">标题</label>
    <input class="ed-title" id="edTitle" placeholder="要做什么？" maxlength="60" autocomplete="off">
    <button class="icon-btn sm" id="edClose" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="ed-r"><span class="ed-k">类别</span><div class="ed-v" id="edCats"></div></div>
  <div class="ed-r"><span class="ed-k">星期</span><div class="ed-v" id="edDays"></div></div>
  <div class="ed-r"><span class="ed-k">时间</span><div class="ed-v ed-time">
    <label class="sr" for="edStart">开始</label><input type="time" id="edStart" step="900">
    <span class="arrow">→</span>
    <label class="sr" for="edEnd">结束</label><input type="time" id="edEnd" step="900">
    <span class="ed-dur" id="edDur"></span>
  </div></div>
  <div class="ed-r"><span class="ed-k">时长</span><div class="ed-v" id="edDurs"></div></div>
  <div class="ed-r"><label class="ed-k" for="edCue">触发</label><div class="ed-v"><input class="ed-input" id="edCue" placeholder="如果到了图书馆三楼坐下，就先打开论文草稿" maxlength="80" autocomplete="off"></div></div>
  <div class="ed-r" id="edGoalWrap"><span class="ed-k">大事</span><div class="ed-v ed-goals" id="edGoals"></div></div>
  <p class="ed-hint" id="edHint" hidden></p>
  <div class="pop-ft">
    <button class="icon-btn ed-act danger" id="edDel" type="button" title="删除" aria-label="删除"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button class="icon-btn ed-act" id="edDup" type="button" title="复制到明天" aria-label="复制到明天"><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg></button>
    <button class="icon-btn ed-act" id="edBack" type="button" title="放回待安排" aria-label="放回待安排"><svg class="ic" viewBox="0 0 24 24"><path d="M4.5 13.5h4l1.5 2.5h4l1.5-2.5h4"/><path d="M6.2 5h11.6l2.7 8.5V19H3.5v-5.5z"/></svg></button>
    <span class="sp"></span>
    <button class="btn ed-paint" id="edPaint" type="button" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.6 2.6 5-5.2"/></svg><span>涂色</span></button>
    <button class="btn solid" id="edDone" type="button">完成</button>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <button class="icon-btn sm m-close" data-close aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="mBody"></div>
  </div>
</div>
<div class="rv" id="rv" role="dialog" aria-modal="true" aria-label="周复盘" hidden>
  <header class="rv-top">
    <h2>复盘</h2>
    <div class="rv-wk"><button class="icon-btn sm" id="rvPrev" type="button" aria-label="上一周"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span id="rvWk"></span><button class="icon-btn sm" id="rvNext" type="button" aria-label="下一周"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <button class="icon-btn" id="rvClose" type="button" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="rv-body" id="rvBody"></div>
</div>
<div class="rt" id="rt" role="dialog" aria-modal="true" aria-labelledby="rtTitle" hidden>
  <header class="rt-top"><h2 id="rtTitle"></h2><div class="rt-dots" id="rtDots"></div><button class="icon-btn" id="rtClose" type="button" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="rt-scroll"><div class="rt-body" id="rtBody"></div></div>
  <footer class="rt-foot" id="rtFoot"><button class="btn ghost big" id="rtBack" type="button">上一步</button><span class="sp"></span><button class="btn solid big" id="rtNext" type="button">下一步</button></footer>
</div>
<div class="focus" id="focus" hidden>
  <div class="f-in">
    <div class="f-cat" id="fCat"></div>
    <h2 class="f-title" id="fTitle"></h2>
    <p class="f-meta" id="fMeta"></p>
    <div class="f-ring">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="k" cx="100" cy="100" r="82"/><circle class="t" cx="100" cy="100" r="93"/><circle class="p" id="fArc" cx="100" cy="100" r="93"/></svg>
      <div class="f-time"><b id="fTime">00:00</b><span id="fSub">剩余时间</span></div>
    </div>
    <p class="f-cue" id="fCue"></p>
    <p class="f-next" id="fNext"></p>
    <div class="f-acts">
      <button class="btn soft big" id="fPause">暂停</button>
      <button class="btn paint big" id="fDone">完成并涂色</button>
      <button class="btn ghost big" id="fExit">退出</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="settle" id="settle" role="dialog" aria-modal="true" aria-labelledby="stTitle" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
