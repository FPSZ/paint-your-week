<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>涂色周历 · promo stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Noto+Sans+SC:wght@400;500;700;900&display=block">
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div class="bg" id="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><div class="grain"></div></div>
<div class="beat" id="beat"></div>

<div class="cam" id="cam">
  <div class="win" id="win">
    <div class="win-bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="url"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="13" height="13" rx="4" fill="#3C5CFF"/><rect x="17" y="2" width="13" height="13" rx="4" fill="#FFB21A"/><rect x="2" y="17" width="13" height="13" rx="4" fill="#FF3B6B"/><rect x="17" y="17" width="13" height="13" rx="4" fill="#22C993"/></svg>涂色周历</span>
      <span class="sp"></span>
    </div>
    <div class="win-body"><iframe id="app" title="app"></iframe></div>
  </div>
</div>

<div class="band" id="band"></div>
<div class="cap" id="cap"><h1 id="capH"></h1><p id="capP"></p></div>
<div class="card" id="card" hidden></div>
<div class="cursor" id="cursor"><svg viewBox="0 0 32 32"><path d="M7 4.5v20.2l5.3-5.1 3.3 7.6 3.4-1.5-3.3-7.4h7.3z"/></svg></div>
<div class="ripples" id="ripples"></div>
<script src="stage.js"></script>
</body>
</html>
